{% extends "base.html" %}
{% block title %}Edit Workout #{{ workout.id }} — Kinetic Clarity{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6 pb-12">
  <div class="flex items-center justify-between border-b border-slate-200 pb-4">
    <div>
      <a href="/" class="text-xs font-semibold text-[#006398] hover:underline block mb-1">← Back to Regimen</a>
      <h1 class="text-2xl font-bold text-slate-900">Edit Workout Session #{{ workout.id }}</h1>
    </div>
    
    <!-- Delete Workout Action -->
    <form action="/workouts/{{ workout.id }}/delete" method="POST" onsubmit="return confirm('Are you sure you want to delete this workout?');">
      <button type="submit" class="px-3.5 py-1.5 rounded-xl border border-red-200 text-red-600 hover:bg-red-50 text-xs font-semibold">
        Delete Workout
      </button>
    </form>
  </div>

  <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
    <form action="/workouts/{{ workout.id }}/update" method="POST" class="space-y-4 text-xs">
      <div>
        <label class="block font-semibold mb-1 text-slate-700">Session Title</label>
        <input type="text" name="title" required value="{{ workout.title }}" class="w-full px-3.5 py-2.5 border rounded-xl text-sm font-semibold text-slate-900">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block font-semibold mb-1 text-slate-700">Category</label>
          <select name="category" class="w-full px-3 py-2 border rounded-xl">
            <option value="Strength" {% if workout.category == 'Strength' %}selected{% endif %}>Strength</option>
            <option value="Aerobic" {% if workout.category == 'Aerobic' %}selected{% endif %}>Aerobic</option>
            <option value="Interval" {% if workout.category == 'Interval' %}selected{% endif %}>Interval</option>
            <option value="Mobility" {% if workout.category == 'Mobility' %}selected{% endif %}>Mobility</option>
            <option value="Olympic" {% if workout.category == 'Olympic' %}selected{% endif %}>Olympic</option>
          </select>
        </div>

        <div>
          <label class="block font-semibold mb-1 text-slate-700">Status</label>
          <select name="status" class="w-full px-3 py-2 border rounded-xl">
            <option value="Scheduled" {% if workout.status == 'Scheduled' %}selected{% endif %}>Scheduled</option>
            <option value="In Progress" {% if workout.status == 'In Progress' %}selected{% endif %}>In Progress</option>
            <option value="Completed" {% if workout.status == 'Completed' %}selected{% endif %}>Completed</option>
          </select>
        </div>

        <div>
          <label class="block font-semibold mb-1 text-slate-700">Scheduled Time</label>
          <input type="text" name="time" value="{{ workout.scheduled_time }}" class="w-full px-3 py-2 border rounded-xl font-mono">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block font-semibold mb-1 text-slate-700">Duration (min)</label>
          <input type="number" name="duration" value="{{ workout.duration_min }}" class="w-full px-3 py-2 border rounded-xl font-mono">
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-700">Calories (kcal)</label>
          <input type="number" name="calories" value="{{ workout.calories }}" class="w-full px-3 py-2 border rounded-xl font-mono">
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-700">Volume (kg)</label>
          <input type="number" step="50" name="volume" value="{{ workout.volume_kg }}" class="w-full px-3 py-2 border rounded-xl font-mono">
        </div>
      </div>

      <div>
        <label class="block font-semibold mb-1 text-slate-700">Exertion (RPE 1-10)</label>
        <input type="number" step="0.5" min="1" max="10" name="rpe" value="{{ workout.rpe }}" class="w-full max-w-xs px-3 py-2 border rounded-xl font-mono">
      </div>

      <div>
        <label class="block font-semibold mb-1 text-slate-700">Notes</label>
        <textarea name="notes" rows="3" class="w-full px-3 py-2 border rounded-xl text-xs">{{ workout.notes }}</textarea>
      </div>

      <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-100">
        <a href="/" class="px-5 py-2.5 rounded-xl border font-semibold text-slate-600 hover:bg-slate-50">Cancel</a>
        <button type="submit" class="px-6 py-2.5 rounded-xl bg-black text-white font-bold text-xs hover:bg-slate-800 transition-colors">
          Update Workout
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
